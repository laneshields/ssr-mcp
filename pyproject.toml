[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssr-mcp"
version = "0.1.0"
description = "MCP server for Juniper/HPE Session Smart Router"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ssr-mcp = "ssr_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["ssr_mcp"]
